# =============================================================================
# Project Sentinel — Kubernetes ConfigMaps
# =============================================================================
# IMPORTANT: keys here must match the env var names the services actually read
# (api/internal/config/config.go, worker/internal/config/config.go). They did not
# used to: this file supplied SERVER_PORT / NSJAIL_PATH / METRICS_PORT while the
# code read API_PORT / WORKER_NSJAIL_PATH / WORKER_METRICS_PORT. Only
# WORKER_POOL_SIZE matched, so every other setting silently fell back to its
# compiled-in default — including a relative nsjail config path that does not
# exist in the image, which broke every execution.
# =============================================================================

# ── API Configuration ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-api-config
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: api
data:
  API_PORT: "8080"
  GIN_MODE: "release"
  API_RATE_LIMIT: "100"
  API_READ_TIMEOUT: "10s"
  API_WRITE_TIMEOUT: "30s"
  # Set this to the real frontend origin(s). "*" is unsafe here: GET
  # /submissions/:id returns the submitted source code and there is no auth.
  API_ALLOWED_ORIGINS: "https://sentinel.example.com"
  # CIDR of the ingress controller, so X-Forwarded-For can be trusted for
  # per-IP rate limiting. Empty would make every request appear to come from
  # the ingress pod and share one bucket.
  API_TRUSTED_PROXIES: "10.42.0.0/16"
  API_REAP_INTERVAL: "30s"
---
# ── Worker Configuration ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-worker-config
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: worker
data:
  # Doubles as the AMQP prefetch count. Because ack happens after execution,
  # prefetch IS the per-pod concurrency ceiling.
  WORKER_POOL_SIZE: "4"
  WORKER_METRICS_PORT: "9090"
  # Must stay below terminationGracePeriodSeconds (60s) in worker-deployment.yaml.
  WORKER_DRAIN_TIMEOUT: "45s"
  WORKER_NSJAIL_PATH: "/usr/bin/nsjail"
  # Baked into the image by worker/Dockerfile. There is no ConfigMap copy of the
  # nsjail configs any more — see the note below.
  WORKER_SANDBOX_CONFIG_DIR: "/etc/sentinel/nsjail"
---
# ── nsjail configuration ──
#
# Deliberately NOT a ConfigMap. The sandbox configs ship in the worker image
# (worker/Dockerfile COPYs sandbox/nsjail/ to /etc/sentinel/nsjail/), which keeps
# exactly one copy in the repo.
#
# The ConfigMap that used to live here was a hand-maintained third copy and had
# drifted into being unusable:
#   * `is_optional:` is not an nsjail field (it is `mandatory: false`), and
#     nsjail rejects an unknown field outright when parsing the protobuf text.
#   * `use_cgroupv2: true` was missing, so nsjail fell back to cgroup v1 paths
#     that do not exist on a v2-only host and the memory limit was silently
#     never applied.
#   * `cwd` and every `envar` line (including PATH) were missing.
# Shipping one copy in the image removes the whole class of problem.
---
# ── RabbitMQ Configuration ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-rabbitmq-config
  namespace: sentinel
  labels:
    app.kubernetes.io/part-of: sentinel
    app.kubernetes.io/component: messaging
data:
  rabbitmq.conf: |
    ## Prometheus metrics
    prometheus.return_per_object_metrics = true

    ## Memory watermark
    vm_memory_high_watermark.relative = 0.7
    ## Disk free limit
    disk_free_limit.relative = 1.5

    ## Queue type default (quorum for durability)
    default_queue_type = quorum

    ## Consumer timeout: 30 minutes
    consumer_timeout = 1800000
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
