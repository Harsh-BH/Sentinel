# =============================================================================
# Project Sentinel — Execution Worker Deployment
# =============================================================================
# Privileged pods (nsjail), tolerate untrusted taint, KEDA-managed replicas
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: sentinel
spec:
  # KEDA manages replicas (min=2, max=50) — this is the initial count
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-worker
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: sentinel-worker
      terminationGracePeriodSeconds: 60
      # Worker needs elevated privileges for nsjail (namespaces, cgroups)
      securityContext:
        runAsNonRoot: false
      # Schedule only on nodes tainted for untrusted workloads
      tolerations:
        - key: workload
          operator: Equal
          value: untrusted
          effect: NoSchedule
      nodeSelector:
        sentinel.io/role: worker
      # Prefer spreading across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sentinel-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: ghcr.io/harsh-bh/sentinel-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sentinel-worker-config
            - secretRef:
                name: sentinel-worker-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              # Headroom for pool_size concurrent sandboxes plus the Go runtime.
              # A single job may request up to 512 MB, so 4 concurrent jobs can
              # legitimately need more than 1Gi — the old limit would OOMKill the
              # pod as soon as concurrency actually worked.
              memory: 3Gi
              ephemeral-storage: 2Gi
          securityContext:
            privileged: true     # Required for nsjail namespace creation
          env:
            # The executor creates sandbox workdirs with os.MkdirTemp(""), which
            # honours TMPDIR. Pointing it at the size-limited emptyDir is what
            # actually bounds sandbox disk usage — the volume used to be mounted
            # at /tmp/sentinel, which nothing ever wrote to, so workdirs landed on
            # the node's writable layer with no limit at all.
            - name: TMPDIR
              value: /sandbox-tmp
          volumeMounts:
            # No nsjail-config mount: the sandbox configs ship in the image at
            # /etc/sentinel/nsjail (see worker/Dockerfile). The ConfigMap copy was
            # a third, drifted, unparseable version of the same files.
            - name: sandbox-tmp
              mountPath: /sandbox-tmp
          livenessProbe:
            # Process liveness ONLY. Restarting a worker never fixes a Postgres
            # outage; checking dependencies here just restarts every pod at once.
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Dependency checks belong here: failing readiness only removes the
            # pod from service, which is the proportionate response.
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: sandbox-tmp
          emptyDir:
            sizeLimit: 2Gi
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-worker
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: health
      protocol: TCP
      name: health
  selector:
    app.kubernetes.io/name: sentinel-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-worker
---
# PodDisruptionBudget — keep at least 1 worker running during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-worker-pdb
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel-worker
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-worker
