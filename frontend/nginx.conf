# =============================================================================
# Project Sentinel — Frontend nginx configuration
# Serves SPA, proxies API & WebSocket to backend
# =============================================================================

# Required for WebSocket upgrade in proxy_set_header Connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml
        application/wasm;

    # Runtime DNS resolution for the variable upstream above. ${DNS_RESOLVER} is
    # the cluster/embedded DNS: 127.0.0.11 for Docker's embedded resolver,
    # kube-dns.kube-system.svc.cluster.local for Kubernetes.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;

    # ── Cache static assets (Vite hashed filenames) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback — serve index.html for client-side routes ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy (also handles WebSocket — /api/v1/.../stream) ──
    #
    # The upstream host comes from ${API_UPSTREAM} (nginx's entrypoint runs
    # envsubst over /etc/nginx/templates/*.template). It used to be hardcoded to
    # "api", the docker-compose service name — so in Kubernetes, where the Service
    # is "sentinel-api", nginx failed to resolve it at startup and the container
    # crash-looped. The frontend could never run outside compose.
    #
    # It is also assigned to a variable before proxy_pass on purpose: with a
    # literal host, nginx resolves it once at startup and dies if the upstream is
    # not yet in DNS. Through a variable, resolution happens per request using the
    # resolver below, so the frontend tolerates the API starting later or moving.
    location /api/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # Long timeouts for the WebSocket variant of this route.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── WebSocket reverse proxy ──
    location /ws/ {
        set $api_upstream ${API_UPSTREAM};
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Health check endpoint (for Docker HEALTHCHECK) ──
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
