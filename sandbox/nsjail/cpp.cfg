# =============================================================================
# nsjail configuration for C++17 compilation and execution
# Project Sentinel — Sandbox Configuration
# =============================================================================

name: "sentinel-cpp"
description: "Sandbox for compiling and executing untrusted C++17 code"

mode: ONCE
hostname: "sandbox"
time_limit: 10     # 10s for compilation; overridden to 5s for execution

log_level: WARNING

# --- Namespace Isolation ---
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# --- Resource Limits ---
use_cgroupv2: true
cgroup_mem_max: 536870912       # 512 MB (more for compilation)
# Swap must be pinned to zero alongside cgroup_mem_max.
#
# cgroup v2's memory.max bounds anon+file memory only. With memory.swap.max
# unlimited (the default), a process that exceeds the limit is paged out instead
# of OOM-killed — so the "limit" silently becomes "start swapping", the job still
# reports SUCCESS, and a memory bomb becomes sustained disk thrashing that hurts
# every other job on the node. The worker also passes --cgroup_mem_swap_max 0 on
# the command line; this keeps the config self-consistent when run by hand.
cgroup_mem_swap_max: 0

cgroup_pids_max: 128            # More processes for g++ compilation
cgroup_cpu_ms_per_sec: 1000

rlimit_as_type: HARD
rlimit_cpu_type: HARD
rlimit_fsize: 128               # Larger for compiled binaries
rlimit_nofile: 128

# --- User Mapping ---
uidmap {
    inside_id: "1000"
    outside_id: ""
    count: 1
}
gidmap {
    inside_id: "1000"
    outside_id: ""
    count: 1
}

# --- Filesystem Mounts ---
mount {
    src: "/usr"
    dst: "/usr"
    is_bind: true
    rw: false
}
mount {
    src: "/lib"
    dst: "/lib"
    is_bind: true
    rw: false
    mandatory: false
}
mount {
    src: "/lib64"
    dst: "/lib64"
    is_bind: true
    rw: false
    mandatory: false
}
mount {
    src: "/bin"
    dst: "/bin"
    is_bind: true
    rw: false
}
mount {
    src: "/etc/alternatives"
    dst: "/etc/alternatives"
    is_bind: true
    rw: false
    mandatory: false
}
mount {
    dst: "/tmp"
    fstype: "tmpfs"
    rw: true
}
mount {
    src: "/dev/null"
    dst: "/dev/null"
    is_bind: true
    rw: false
}
mount {
    src: "/dev/zero"
    dst: "/dev/zero"
    is_bind: true
    rw: false
}
mount {
    src: "/dev/urandom"
    dst: "/dev/urandom"
    is_bind: true
    rw: false
}
mount {
    dst: "/proc"
    fstype: "proc"
    rw: false
}

# --- Seccomp-BPF syscall filtering (ENABLED) ---
# Allowlist with DEFAULT KILL. Path is on the host filesystem, resolved before
# the sandbox is entered. See sandbox/policies/cpp.policy for how the list was
# derived and what is deliberately excluded.
#
# This was commented out for a long time because the policy listed `fstat`,
# which this build of kafel does not define, so nsjail refused to start. The
# syscall was never needed — glibc uses newfstatat — so the fix removed it
# rather than working around it.
seccomp_policy_file: "/etc/sentinel/policies/cpp.policy"

cwd: "/tmp/work"
iface_no_lo: true

envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "HOME=/tmp"
envar: "LANG=en_US.UTF-8"
