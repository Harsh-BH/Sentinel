# =============================================================================
# Project Sentinel — CI Pipeline
# =============================================================================
# Runs on every push/PR to main:
#   1. Go (API + Worker): go build, go vet, unit tests (race + coverage)
#   2. Lint Go (API + Worker) with a pinned golangci-lint
#   3. Frontend: ESLint + build (tsc + vite)
#   4. Migrations: apply up + down against a real Postgres 16
#   5. Build & push Docker images to GHCR (main branch only)
#
# The previous full-stack integration job (docker-compose + nsjail) was removed:
# nsjail needs namespace-creation privileges that GitHub-hosted runners do not
# grant, so it could never pass here. Correctness is now gated on build + vet +
# unit tests + a live migration apply, all of which run cleanly in Actions.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"
  GOLANGCI_LINT_VERSION: "v1.64.8"
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════
  # Go — build, vet, unit tests (API + Worker)
  # ═══════════════════════════════════════════════════════════
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.module }}/coverage.out
          flags: ${{ matrix.module }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  # Go — Lint (pinned golangci-lint)
  # ═══════════════════════════════════════════════════════════
  lint-go:
    name: Lint Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ matrix.module }}
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # ═══════════════════════════════════════════════════════════
  # Frontend — Lint & Build
  # ═══════════════════════════════════════════════════════════
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  # ═══════════════════════════════════════════════════════════
  # Migrations — apply up + down against a real Postgres
  # ═══════════════════════════════════════════════════════════
  migrations:
    name: Migrations (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_secret
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: sentinel_secret
    steps:
      - uses: actions/checkout@v4
      - name: Apply up migration
        run: psql -h localhost -U sentinel -d sentinel -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.up.sql
      - name: Verify schema
        run: psql -h localhost -U sentinel -d sentinel -v ON_ERROR_STOP=1 -c "\d execution_jobs"
      - name: Apply down migration
        run: psql -h localhost -U sentinel -d sentinel -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.down.sql

  # ═══════════════════════════════════════════════════════════
  # Docker Build & Push to GHCR (main branch only)
  # ═══════════════════════════════════════════════════════════
  build-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [go, lint-go, frontend, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        include:
          - image: sentinel-api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: sentinel-worker
            context: .
            dockerfile: ./worker/Dockerfile
          - image: sentinel-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
